# mattertui config — copy to ~/.config/mattertui/config.toml
#
# Rooms and devices appear in the order they are declared; the dashboard
# lays them out automatically. Pair a device with:
#   mattertui pair <device-id> <setup-code>

[ui]
temperature_unit = "celsius"   # celsius | fahrenheit
motion = true                  # false = no ambient animation
history_hours = 24             # in-memory graph window (1–168)
colors = "auto"                # auto | truecolor | 256 | 16 (if detection is wrong)

[log]
panel = "hidden"               # hidden | open — toggle with `
height = 8
filter = "info,mdns_sd=warn"   # tracing EnvFilter syntax; RUST_LOG overrides

# Colours come from one palette anchored on orange: orange, teal, violet,
# rose, gold, sky, sage. Rooms take them in turn and devices take the ones
# after their room's; set `accent` on a room or device to pin one. Icons are
# plain symbols, never emoji:
#   lamp bulb plug fan tv thermostat thermometer water humidity battery heating
#   cool home sofa bed moon sun kitchen bath office desk garden tree teddy
#   games books garage star heart snow
[[room]]
id = "living-room"
name = "Living room"
icon = "sofa"

[[room]]
id = "bedroom"
name = "Bedroom"

[[device]]
id = "living-room-lamp"        # also the pairing label: a-z, 0-9, -
name = "Lamp"
room = "living-room"
kind = "plug"                  # plug | thermostat | temperature_sensor | leak_sensor

[[device]]
id = "bedroom-temp"
name = "Bedside"
room = "bedroom"
kind = "temperature_sensor"
# endpoint = 1                 # optional; auto-detected
# featured = true              # fills its room with a big graph; the room's
                               # other devices stack beside it (like btop's
                               # CPU box)
